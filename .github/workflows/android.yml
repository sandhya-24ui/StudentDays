name: Build Android
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - name: Prepare www folder
     run: |
       mkdir -p www
       cp index.html config.js asset* www/ 2>/dev/null || true
      - name: Create Android project (first run only)
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          # PRD: Android 8 (API 26) and above
          sed -i 's/minSdkVersion = 24/minSdkVersion = 26/' android/variables.gradle || true
      - name: Icons and splash
        run: npm run assets
      - run: npx cap sync android
      - name: Set version
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i 's/versionName "[^"]*"/versionName "1.0.${{ github.run_number }}"/' android/app/build.gradle
      - name: Debug APK (install on a phone to test)
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: studentdays-debug-apk, path: android/app/build/outputs/apk/debug/*.apk }
      - name: Signed release AAB (only if keystore secrets are set)
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cd android && ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/release.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
      - uses: actions/upload-artifact@v4
        if: env.HAS_KEYSTORE == 'true'
        with: { name: studentdays-release-aab, path: android/app/build/outputs/bundle/release/*.aab }
